<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki Associations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <button id="themeToggle" class="theme-toggle" aria-label="Basculer entre mode clair et sombre" title="Mode clair / sombre">🌙</button>
  <div class="brand-row" aria-hidden="true">
    <span class="brand-dot" style="background:#4285F4;"></span>
    <span class="brand-dot" style="background:#EA4335;"></span>
    <span class="brand-dot" style="background:#FBBC05;"></span>
    <span class="brand-dot" style="background:#34A853;"></span>
  </div>
  <h1>Wiki <em>Associations</em></h1>
  <p class="subtitle">
    Relie chaque <strong>portrait</strong> à sa <strong>description</strong> tirée de Wikipédia. Le nom est masqué : à toi de reconnaître qui est qui.
  </p>

  <div class="toolbar">
    <span class="status" id="status">Chargement…</span>
    <button id="newGameBtn" class="btn-primary">Nouvelle partie</button>
  </div>

  <div id="loading" class="loading"><span class="spinner"></span>Interrogation de Wikipédia…</div>

  <div class="board" id="boardWrap" style="display:none;">
    <div class="portraits-pane">
      <div class="col-label">Portraits</div>
      <div id="leftCol" class="portraits-grid"></div>
    </div>
    <div class="clues-pane">
      <div class="col-label">Qui suis-je ?</div>
      <div id="rightCol" class="clues-list"></div>
    </div>
  </div>

  <div class="result-banner" id="resultBanner"></div>

  <footer>Données via l'API REST de <a href="https://fr.wikipedia.org" target="_blank" rel="noopener">Wikipédia</a></footer>
</div>

<script src="script.js"></script>
</body>
</html>
